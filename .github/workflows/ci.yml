name: CI

# Every push and pull request: checks and tests. Pull requests: a production plan.
# main: deploy staging, smoke-test it, then production (after approval, if the
# production environment requires it). The steps are mise tasks (mise.toml), so a
# deploy by hand runs the same commands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ingest:
        description: Deploy ingest even if nothing it is built from changed
        type: boolean
        default: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mise run check
      - run: mise run test

  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_plan: -lock=false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mise run plan production

  # Whether ingest needs a new image
  changes:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      ingest: ${{ steps.filter.outputs.ingest == 'true' || inputs.ingest == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ingest:
              - analysis/**
              - api/src/worker/ingest.ts
              - api/wrangler.ingest.jsonc
              - api/package.json
              - pnpm-lock.yaml
              - .dockerignore
              - infra/deploy-ingest.sh

  staging:
    needs: [check, changes]
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
      ingest: ${{ needs.changes.outputs.ingest == 'true' }}
    secrets: inherit

  production:
    needs: [changes, staging]
    uses: ./.github/workflows/deploy.yml
    with:
      env: production
      ingest: ${{ needs.changes.outputs.ingest == 'true' }}
    secrets: inherit
