name: CI

# Every push and pull request, and each merge group in main's merge queue: checks and
# tests (the check job, which the queue requires). Pull requests: a plan per environment,
# and a preview environment, pr-<number>, deployed and smoke-tested on each push and torn
# down when the pull request closes (sweep.yml catches any left); the smoke job gates
# merging on it.
# main: deploy staging and smoke-test it. A v* tag on a commit in main: staging, then production. The ingest
# images are built once, before any deploy. The steps are just recipes (justfile) and
# infra/deploy-ingest.sh, so a deploy by hand runs the same commands.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just check
      - run: just test

  # Before any deploy, for all of them: the images are named by their inputs, not the
  # environment. Only builds and pushes an image whose inputs changed. Runs wherever
  # deploy-preview or deploy-staging does.
  build-ingest-image:
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The languages in infra/deploy-ingest.sh
        lang: [pl, en]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # The model downloads read HF_TOKEN (impureEnvVars) from the daemon, not this job
      - uses: ./.github/actions/setup
        with:
          nix-conf: |
            extra-experimental-features = configurable-impure-env
            impure-env = HF_TOKEN=${{ secrets.HF_TOKEN }}
      # deploy-ingest.sh pushes to it
      - uses: cachix/cachix-action@v17
        with:
          name: andyyu2004
          skipPush: true
      - run: infra/deploy-ingest.sh build ${{ matrix.lang }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  plan-infra:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [staging, production]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_plan: -lock=false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just plan ${{ matrix.env }}

  # Pull requests from forks get neither: they'd need the secrets. The group is held for
  # the whole deploy (all of deploy.yml's jobs), so a teardown waits for a deploy, and a
  # push waits for the last push's deploy instead of cancelling it part way; a pending
  # deploy is replaced by a newer one, or by the teardown.
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build-ingest-image
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      env: pr-${{ github.event.number }}
    secrets: inherit

  # Required by main's ruleset, with check. On a pull request it passes only if the
  # preview deployed and its smoke test passed. A merge group can't have a preview, and its
  # pull request's passed to get there, so there it passes. A fork's pull request gets no
  # preview and skips this, which counts as passing.
  smoke:
    if: always() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository))
    needs: deploy-preview
    runs-on: ubuntu-24.04
    steps:
      - if: github.event_name == 'pull_request' && needs.deploy-preview.result != 'success'
        run: |
          echo "the preview's deploy or smoke test didn't pass: ${{ needs.deploy-preview.result }}" >&2
          exit 1

  teardown-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
    steps:
      # The base branch: the pull request's may be deleted already
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: ./.github/actions/setup
      - run: just teardown pr-${{ github.event.number }}

  deploy-staging:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-ingest-image
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
    secrets: inherit

  check-tag-on-main:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deploy-staging, check-tag-on-main]
    uses: ./.github/workflows/deploy.yml
    with:
      env: production
    secrets: inherit
