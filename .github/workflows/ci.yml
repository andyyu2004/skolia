name: CI

# Every push and pull request: checks and tests. Pull requests: a plan per environment.
# main: deploy staging and smoke-test it. Production: run the workflow by hand with
# "production" ticked. The steps are mise tasks (mise.toml), so a deploy by hand runs
# the same commands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      production:
        description: After staging passes, deploy production
        type: boolean
        default: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mise run check
      - run: mise run test

  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [staging, production]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_plan: -lock=false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mise run plan ${{ matrix.env }}

  staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
    secrets: inherit

  # Only by hand while the repo is private: GitHub Free has no required reviewers on a
  # private repo's environments
  production:
    if: github.event_name == 'workflow_dispatch' && inputs.production
    needs: staging
    uses: ./.github/workflows/deploy.yml
    with:
      env: production
    secrets: inherit
