name: CI

# Every push and pull request, and each merge group in main's merge queue: checks and
# tests (the check job, which the queue requires). Pull requests: a plan per environment,
# and a preview environment, pr-<number>, deployed and end-to-end tested on each push and torn
# down when the pull request closes (sweep.yml catches any left); the mergeable job
# gates merging on it.
# main: deploy staging and end-to-end test it. A v* tag on a commit in main: staging, then production. The ingest
# images are built once, before any deploy. The steps are just recipes (justfile) and
# infra/deploy-ingest.sh, so a deploy by hand runs the same commands.
# A pull request, merge group or push to main that only changes content (curated texts, docs,
# Markdown; .github/changes.py) skips check, the screenshots, the image builds, the plans and
# the deploys. If texts changed, it checks they parse (check-texts) and runs just the seed:
# against staging on a push to main, and against the pull request's preview if an earlier
# push deployed one. The plans run only when something they read changed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # deploy, texts and infra, from the files the run changes (.github/changes.py)
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      texts: ${{ steps.changes.outputs.texts }}
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        run: python3 -I .github/changes.py "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH"

  mirror-providers:
    if: github.event.action != 'closed' && needs.changes.outputs.deploy == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    concurrency:
      group: mirror-providers
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: infra/mirror-providers.py
        timeout-minutes: 10

  check:
    if: github.event.action != 'closed' && needs.changes.outputs.deploy == 'true'
    needs: [changes, mirror-providers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just check
      - run: just test

  # The reader's pages against their baselines (just screenshot), on arm64 like the
  # Docker image on a Mac that takes them. A failure's expected, actual and diff images
  # are in its screenshots artifact.
  # In place of check, for a run that only changes content, some of it curated texts: that
  # they parse (api/src/texts.test.ts), which needs no build. A docs-only run checks nothing.
  check-texts:
    if: github.event.action != 'closed' && needs.changes.outputs.deploy == 'false' && needs.changes.outputs.texts == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test src/texts.test.ts
        working-directory: api

  screenshots:
    if: github.event.action != 'closed' && needs.changes.outputs.deploy == 'true'
    needs: changes
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup
      - run: just screenshot
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            reader/playwright-report/
            reader/test-results/

  # Before any deploy, for all of them: the images are named by their inputs, not the
  # environment. Only builds and pushes an image whose inputs changed. Runs wherever
  # deploy-preview or deploy-staging does.
  build-ingest-image:
    if: >-
      needs.changes.outputs.deploy == 'true' && (
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    needs: [check, changes]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The languages in infra/deploy-ingest.sh
        lang: [pl, en, fr]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # The model downloads read HF_TOKEN (impureEnvVars) from the daemon, not this job
      - uses: ./.github/actions/setup
        with:
          nix-conf: |
            extra-experimental-features = configurable-impure-env
            impure-env = HF_TOKEN=${{ secrets.HF_TOKEN }}
      # deploy-ingest.sh pushes to it
      - uses: cachix/cachix-action@v17
        with:
          name: andyyu2004
          skipPush: true
      - run: infra/deploy-ingest.sh build ${{ matrix.lang }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Only when something a plan reads changed (.github/changes.py)
  plan-infra:
    if: needs.changes.outputs.infra == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, changes]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [staging, production]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_plan: -lock=false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just plan ${{ matrix.env }}

  # Pull requests from forks get neither: they'd need the secrets. The group is held for
  # the whole deploy (all of deploy.yml's jobs), so a teardown waits for a deploy, and a
  # push waits for the last push's deploy instead of cancelling it part way; a pending
  # deploy is replaced by a newer one, or by the teardown.
  deploy-preview:
    if: needs.changes.outputs.deploy == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [changes, build-ingest-image]
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      env: pr-${{ github.event.number }}
    secrets: inherit

  # Required by main's ruleset, with check. It fails if check should have run and didn't
  # pass, or if check-texts failed. On a pull request it also needs the preview deployed
  # and its end-to-end tests passed, unless the pull request only changes content, which
  # gets no preview. A merge group can't have a preview, and its pull request's passed to
  # get there, so there it needs only the checks. A fork's pull request gets no preview and
  # skips this, which counts as passing; check itself is required too.
  mergeable:
    if: always() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository))
    needs: [changes, check, check-texts, deploy-preview, seed-preview]
    runs-on: ubuntu-24.04
    steps:
      - if: needs.check-texts.result == 'failure'
        run: |
          echo "a curated text doesn't parse" >&2
          exit 1
      - if: github.event_name == 'pull_request' && needs.seed-preview.result == 'failure'
        run: |
          echo "seeding the preview failed" >&2
          exit 1
      # A skipped check counts as passing, so a run that should check must have
      - if: needs.changes.result != 'success'
        run: |
          echo "couldn't tell what the run changes: ${{ needs.changes.result }}" >&2
          exit 1
      - if: needs.changes.outputs.deploy == 'true' && needs.check.result != 'success'
        run: |
          echo "check didn't pass: ${{ needs.check.result }}" >&2
          exit 1
      - if: github.event_name == 'pull_request' && needs.changes.outputs.deploy == 'true' && needs.deploy-preview.result != 'success'
        run: |
          echo "the preview's deploy or end-to-end tests didn't pass: ${{ needs.deploy-preview.result }}" >&2
          exit 1

  # A pull request that only changes content, some of it curated texts: seeds its preview
  # if an earlier push deployed one (deploy-preview seeds a preview it deploys)
  seed-preview:
    if: needs.changes.outputs.deploy == 'false' && needs.changes.outputs.texts == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [changes, check-texts]
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/seed.yml
    with:
      env: pr-${{ github.event.number }}
      if-deployed: true
    secrets: inherit

  teardown-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
    steps:
      # The base branch: the pull request's may be deleted already
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: ./.github/actions/setup
      - run: just teardown pr-${{ github.event.number }}

  deploy-staging:
    if: needs.changes.outputs.deploy == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [changes, build-ingest-image]
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
    secrets: inherit

  # A push to main that only changes content, some of it curated texts. A tag always
  # deploys (deploy-staging), which seeds.
  seed-staging:
    if: needs.changes.outputs.deploy == 'false' && needs.changes.outputs.texts == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, check-texts]
    uses: ./.github/workflows/seed.yml
    with:
      env: staging
    secrets: inherit

  check-tag-on-main:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deploy-staging, check-tag-on-main]
    uses: ./.github/workflows/deploy.yml
    with:
      env: production
    secrets: inherit
