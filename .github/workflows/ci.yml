name: CI

# Every push and pull request: checks and tests. Pull requests: a plan per environment,
# and a preview environment, pr-<number>, deployed and smoke-tested on each push and torn
# down when the pull request closes (sweep.yml catches any left). main: deploy staging
# and smoke-test it. A v* tag on a commit in main: staging, then production. The steps
# are mise tasks (mise.toml), so a deploy by hand runs the same commands.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mise run check
      - run: mise run test

  plan:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [staging, production]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_plan: -lock=false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mise run plan ${{ matrix.env }}

  # Pull requests from forks get neither: they'd need the secrets. The group is held for
  # the whole deploy (all of deploy.yml's jobs), so a teardown waits for a deploy, and a
  # push waits for the last push's deploy instead of cancelling it part way; a pending
  # deploy is replaced by a newer one, or by the teardown.
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      env: pr-${{ github.event.number }}
    secrets: inherit

  preview-teardown:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
    steps:
      # The base branch: the pull request's may be deleted already
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: ./.github/actions/setup
      - run: mise run teardown pr-${{ github.event.number }}

  staging:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
    secrets: inherit

  tag-on-main:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [staging, tag-on-main]
    uses: ./.github/workflows/deploy.yml
    with:
      env: production
    secrets: inherit
