name: Sweep previews

# Nightly: tears down any preview environment (pr-<N>) whose pull request isn't open, in
# case ci.yml's teardown on close failed or never ran. infra/sweep.sh finds them by the
# names of what they're made of, and fails if any are left.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  sweep:
    runs-on: ubuntu-24.04
    concurrency:
      group: sweep-previews
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: infra/sweep.sh
