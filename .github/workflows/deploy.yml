name: Deploy

# One environment: Terraform and migrations; then the ingest Worker with the images
# ci.yml's build-ingest-image pushed; then the skolia Worker (reader and API) and the
# end-to-end tests. The ingest Worker consumes the queue the skolia Worker feeds, so it goes
# first. Called by ci.yml, after the images are built. wrangler leaves an unchanged image
# as it is. The lexicon loads beside them, after the migrations; it's skipped when D1
# already has its version. Previews (pr-<N>) share one GitHub environment, preview.

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-infra:
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_apply: -auto-approve
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just deploy-infra ${{ inputs.env }}

  # The lexicon for cards, built with Nix from the lexicon and venv ci.yml's
  # build-ingest-image put in Cachix (just load-lexicon)
  load-lexicon:
    needs: deploy-infra
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    concurrency:
      group: load-lexicon-${{ inputs.env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: cachix/cachix-action@v17
        with:
          name: andyyu2004
          skipPush: true
      - run: just load-lexicon ${{ inputs.env }}

  # Reads the R2 credentials from Terraform, so after deploy-infra
  deploy-ingest:
    needs: deploy-infra
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    concurrency:
      group: deploy-ingest-${{ inputs.env }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: infra/deploy-ingest.sh ${{ inputs.env }} deploy

  # After the lexicon is loaded: the end-to-end tests' card and lexicon journeys read it
  deploy-web:
    needs: [deploy-ingest, load-lexicon]
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    concurrency:
      group: deploy-web-${{ inputs.env }}
      cancel-in-progress: false
    # A preview's wrangler config is made in each job that needs it (infra/wrangler.sh)
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
      # The environment's Google OAuth client (infra/README.md); the preview environment has none
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      # The tags, for git describe (justfile deploy-web and e2e)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: just deploy-web ${{ inputs.env }}
      - name: End-to-end tests
        run: just e2e ${{ inputs.env }}
