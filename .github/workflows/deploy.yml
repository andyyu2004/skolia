name: Deploy

# One environment: migrations, Terraform and the skolia Worker; each language's ingest
# image, built in parallel; then the ingest Worker with those images, and a smoke test.
# Called by ci.yml. deploy-ingest only builds and pushes an image whose inputs changed,
# and wrangler leaves an unchanged one as it is.

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env }}
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_apply: -auto-approve
    steps:
      # The tags, for git describe (mise.toml deploy)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: mise run deploy ${{ inputs.env }}

  # The images are named by their inputs, not the environment, so a build for one
  # environment is reused by the other
  ingest-image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The languages in infra/deploy-ingest.sh
        lang: [pl, en]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v4
      - name: Build and push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: infra/deploy-ingest.sh ${{ inputs.env }} build ${{ matrix.lang }}

  ingest:
    needs: [deploy, ingest-image]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env }}
    concurrency:
      group: deploy-ingest-${{ inputs.env }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "1"
    steps:
      # The tags, for git describe (mise.toml smoke)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Deploy ingest
        run: infra/deploy-ingest.sh ${{ inputs.env }} deploy
      - name: Smoke test
        run: mise run smoke ${{ inputs.env }}
