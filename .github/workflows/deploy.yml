name: Deploy

# One environment: migrations and Terraform, the ingest containers, and for staging a
# smoke test. Called by ci.yml. deploy-ingest only builds and pushes an image whose
# inputs changed, and wrangler leaves an unchanged one as it is.

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env }}
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_ACCESS_KEY }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      TF_IN_AUTOMATION: "1"
      TF_CLI_ARGS_apply: -auto-approve
    steps:
      # The tags, for git describe (mise.toml deploy)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: mise run deploy ${{ inputs.env }}

      # Room for the images, in case they have to be built
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v4
      # Lets buildx in a script reach the Actions cache
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Deploy ingest
        env:
          INGEST_CACHE: type=gha,scope=ingest
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: mise run deploy-ingest ${{ inputs.env }}

      - name: Smoke test
        if: inputs.env == 'staging'
        run: mise run smoke staging
