name: Sync curated

# Only the curated texts in texts/ (just sync-curated), for a run that changes nothing else
# (.github/changes.py), so it doesn't need a deploy. Shares deploy-web's concurrency group,
# so it waits for a deploy in progress, which syncs too. With if-deployed, an environment
# whose Worker isn't there (a pull request that never had a preview) is skipped.

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      if-deployed:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  sync-curated:
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(inputs.env, 'pr-') && 'preview' || inputs.env }}
    concurrency:
      group: deploy-web-${{ inputs.env }}
      cancel-in-progress: false
    steps:
      # The skolia Worker of a preview is skolia-pr-<N> (infra/preview.py)
      - id: deployed
        run: |
          if [ "${{ inputs.if-deployed }}" != true ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/skolia-${{ inputs.env }}/settings")
          case $status in
            200) echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "yes=false" >> "$GITHUB_OUTPUT"; echo "no skolia-${{ inputs.env }} Worker, so nothing to sync" ;;
            *) echo "couldn't tell whether skolia-${{ inputs.env }} is deployed: HTTP $status" >&2; exit 1 ;;
          esac
      - if: steps.deployed.outputs.yes == 'true'
        uses: actions/checkout@v7
      - if: steps.deployed.outputs.yes == 'true'
        uses: ./.github/actions/setup
      - if: steps.deployed.outputs.yes == 'true'
        run: just sync-curated ${{ inputs.env }}
