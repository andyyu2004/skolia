name: Seed

# Only the curated texts in texts/ (just seed), for a push that changes nothing else
# (.github/changes.py), so it doesn't need a deploy. Shares deploy-web's concurrency group,
# so it waits for a deploy in progress, which seeds too.

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  seed:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env }}
    concurrency:
      group: deploy-web-${{ inputs.env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just seed ${{ inputs.env }}
