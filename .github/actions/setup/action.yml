name: Setup
description: Nix with flake.nix's packages.ci (terraform, just, Node, pnpm and uv), and the JS dependencies
inputs:
  nix-conf:
    description: Extra nix.conf lines for the Nix install
    default: ""
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: ${{ inputs.nix-conf }}
    # Fetched in the background while the caches are restored; the build below waits for it
    - run: nohup nix build --no-link .#ci >"$RUNNER_TEMP/nix-ci.log" 2>&1 &
      shell: bash
    - uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.local/share/pnpm
          ~/.cache/uv
          ~/.local/share/uv/python
        key: setup-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'analysis/uv.lock') }}
        restore-keys: setup-${{ runner.os }}-
    - run: |
        if ! out=$(nix build --no-link --print-out-paths .#ci); then
          cat "$RUNNER_TEMP/nix-ci.log"
          exit 1
        fi
        echo "$out/bin" >> "$GITHUB_PATH"
      shell: bash
    - run: pnpm install --frozen-lockfile --store-dir ~/.local/share/pnpm/store
      shell: bash
    - run: echo "TF_CLI_CONFIG_FILE=$GITHUB_WORKSPACE/infra/terraformrc" >> "$GITHUB_ENV"
      shell: bash
