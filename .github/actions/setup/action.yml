name: Setup
description: pnpm, Node and the JS dependencies, uv, and mise (terraform and the tasks)
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: astral-sh/setup-uv@v10
      with:
        working-directory: analysis
        enable-cache: true
    - uses: jdx/mise-action@v5
