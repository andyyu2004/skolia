name: Setup
description: pnpm, Node and the JS dependencies, uv, and Nix with terraform and just (flake.nix)
inputs:
  nix-conf:
    description: Extra nix.conf lines for the Nix install
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # setup-uv publishes no moving major tag
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        working-directory: analysis
        enable-cache: true
    - uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: ${{ inputs.nix-conf }}
    - run: echo "$(nix build --no-link --print-out-paths .#tools)/bin" >> "$GITHUB_PATH"
      shell: bash
