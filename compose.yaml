# Local stack: the reader talks to skolia-api, which queues import jobs for skolia-ingest.
# Redis stands in for Cloudflare Queues and RustFS (S3 API) for R2. See DEVELOP.md.
name: skolia

x-storage-env: &storage-env
  AWS_ACCESS_KEY_ID: skolia
  AWS_SECRET_ACCESS_KEY: skolia-local-only
  AWS_DEFAULT_REGION: auto
  SKOLIA_S3_BUCKET: skolia

services:
  redis:
    image: redis:8.8.4-alpine
    ports: ["6379:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  storage:
    image: rustfs/rustfs:1.0.4
    ports: ["9000:9000", "9001:9001"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: skolia
      RUSTFS_SECRET_KEY: skolia-local-only
    volumes: [storage:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 2s
      retries: 15

  # Creates the bucket once storage is up, then exits
  storage-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      storage: {condition: service_healthy}
    environment: *storage-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://storage:9000 s3api head-bucket --bucket skolia 2>/dev/null
        || aws --endpoint-url http://storage:9000 s3 mb s3://skolia

  api:
    build: {context: ., dockerfile: api/Dockerfile}
    depends_on:
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    ports: ["8787:8787"]
    environment:
      <<: *storage-env
      AWS_REGION: auto
      SKOLIA_S3_ENDPOINT: http://storage:9000
      SKOLIA_REDIS_URL: redis://redis:6379/0
      SKOLIA_DB: /data/skolia.sqlite
    volumes: ["./data/api:/data"]

  ingest:
    build: {context: analysis}
    depends_on:
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    environment:
      <<: *storage-env
      SKOLIA_S3_ENDPOINT: http://storage:9000
      SKOLIA_REDIS_URL: redis://redis:6379/0
      SKOLIA_LEXICON: /lexicon/pl.sqlite
    volumes:
      - ./data/lexicon:/lexicon:ro
      - models:/root/.cache/huggingface

volumes:
  redis:
  storage:
  models:
