[tools]
terraform = "1.17.1"

# mise run <task> [env]. CI runs the same tasks (.github/workflows/ci.yml). Deploy tasks
# need the credentials in infra/README.md.

[tasks.check]
description = "Typecheck and lint everything"
run = [
  "pnpm check",
  "cd analysis && uv run ruff check . && uv run ruff format --check . && uv run pyright",
  "terraform -chdir=infra fmt -check",
  "TF_DATA_DIR=.terraform-validate terraform -chdir=infra init -backend=false -input=false >/dev/null && TF_DATA_DIR=.terraform-validate terraform -chdir=infra validate",
]

[tasks.test]
description = "Unit tests, and the built Worker's Durable Object in workerd"
depends = ["build"]
run = ["pnpm test", "cd analysis && uv run pytest -q"]

[tasks.build]
description = "The reader and the API bundle (api/dist, for the workerd tests)"
run = [
  "pnpm --filter @skolia/reader build",
  "pnpm --dir api exec wrangler deploy --dry-run --outdir dist --env=''",
]

[tasks.dev]
description = "wrangler dev (both Workers, the ingest container, local D1/R2/queue) and the reader's Vite server"
depends = ["dev:api", "dev:reader"]

[tasks."dev:api"]
description = "wrangler dev on :8787 with local state in api/.wrangler/state"
dir = "api"
run = [
  "pnpm exec wrangler d1 migrations apply DB --local --env=''",
  "pnpm exec wrangler dev -c wrangler.jsonc -c wrangler.ingest.jsonc --port 8787",
]

[tasks."dev:reader"]
description = "Vite on :5173, proxying /api to :8787"
run = "pnpm --filter @skolia/reader dev --port 5173 --strictPort"

[tasks.e2e]
description = "Import a text through wrangler dev with fresh local state and wait until it's ready"
depends = ["build"]
run = "api/scripts/e2e.sh"

[tasks.data]
description = "The lexicon and valency files, from the inputs pinned in analysis/inputs.sha256"
run = "analysis/scripts/build_data.sh"

[tasks.plan]
description = "What a deploy would change in Terraform's resources"
usage = 'arg "<env>" help="staging, production or pr-<N>"'
run = "infra/tf.sh $usage_env plan -input=false"

[tasks.migrate]
description = "Apply D1 migrations"
usage = 'arg "<env>" help="staging, production or pr-<N>"'
run = "infra/wrangler.sh $usage_env d1 migrations apply DB --remote"

[tasks.apply]
description = "Terraform: storage, queue, ingest's R2 token, billing alerts"
usage = 'arg "<env>" help="staging, production or pr-<N>"'
run = "infra/tf.sh $usage_env apply -input=false"

[tasks.deploy]
description = "Terraform and D1 migrations, the ingest Worker, then the skolia Worker: the queue's consumer before its producer"
usage = 'arg "<env>" help="staging, production or pr-<N>"'
run = [
  "mise run deploy-infra $usage_env",
  "mise run deploy-ingest $usage_env",
  "mise run deploy-web $usage_env",
]

[tasks.deploy-infra]
description = "Terraform, then D1 migrations; for a preview, its wrangler configs in between (they need its D1 id)"
usage = 'arg "<env>" help="staging, production or pr-<N>"'
run = [
  "mise run apply $usage_env",
  'case $usage_env in pr-*) infra/preview.py config "$usage_env" ;; esac',
  "mise run migrate $usage_env",
]

[tasks.deploy-web]
description = "The skolia Worker (reader and API) with wrangler"
usage = 'arg "<env>" help="staging, production or pr-<N>"'
# The version /api/version and the reader's footer show
env = { VITE_VERSION = "{{exec(command='git describe --tags --always --dirty')}}" }
run = [
  "pnpm --filter @skolia/reader build",
  'infra/wrangler.sh $usage_env deploy --define "VERSION:\"$VITE_VERSION\""',
]

[tasks.deploy-ingest]
description = "Build, push and deploy the ingest container"
usage = 'arg "<env>" help="staging, production or pr-<N>"'
run = "infra/deploy-ingest.sh $usage_env"

[tasks.smoke]
description = "Check the environment serves this checkout's version, then import a new text and wait until it's ready"
usage = 'arg "<env>" help="staging, production or pr-<N>"'
env = { VERSION = "{{exec(command='git describe --tags --always --dirty')}}" }
run = '''
case $usage_env in
  production) url=https://skolia.io ;;
  staging) url=https://staging.skolia.io ;;
  *) url=$(infra/preview.py url "$usage_env") || exit ;;
esac
node api/src/smoke.ts "$url" "$VERSION"
'''

[tasks.teardown]
description = "Delete a preview (pr-<N>): its Workers, container applications, storage, queue and Terraform state"
usage = 'arg "<env>" help="pr-<N>"'
run = "infra/teardown.sh $usage_env"
