kind: inline
title: "Gdzie jest mój kot?"
author: "Clare Verbeek, Thembani Dladla, Zanele Buthelezi; translated by Aleksandra Migorska"
licence: cc-by-nc
source: https://global-asp.github.io/storybooks-poland/stories/pl/0009/
tags:
  level: A1
text: |
  Gdzie jest mój kot?

  Czy jest pod łóżkiem?

  Czy jest na szafie?

  Czy jest za kanapą?

  Czy jest obok śmietnika?

  Czy jest w koszu na pranie?

  Czy jest na zewnątrz?

  O! Tutaj jest!
