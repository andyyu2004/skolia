kind: inline
title: "Zama jest świetna!"
author: "Michael Oguttu; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0095/
tags:
  level: A2
text: |
  [Mój młodszy braciszek długo rano śpi. Ja budzę się wcześnie rano, bo jestem świetna!]{02}

  [To ja wpuszczam słoneczne światło.]{03}

  [„Jesteś moją poranną gwiazdką” – mówi mama.]{04}

  [Sama się myję, nie potrzebuję niczyjej pomocy.]{05}

  [Radzę sobie z zimną wodą i niebieskim mydłem.]{06}

  [„Nie zapomnij o zębach” – przypomina mi mama. „Ja? Nigdy” – odpowiadam.]{07}

  [Po umyciu, witam się z dziadkiem i ciocią, życzę im miłego dnia.]{08}

  [Potem się ubieram. „Jestem już duża” – mówię do mamy.]{09}

  [Potrafię zapiąć swoje guziki i zapiąć swoje buty.]{10}

  [Upewniam się, że mój młodszy braciszek jest gotowy do szkoły.]{11}

  [Każdego dnia w szkole staram się jak najlepiej potrafię.]{12}

  [Wykonuję wszystkie te zadania każdego dnia. Ale mimo to, i tak najbardziej cieszą mnie zabawa, psoty i figle!]{13}
