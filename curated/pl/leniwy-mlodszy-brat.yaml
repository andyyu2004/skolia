kind: inline
title: "Leniwy młodszy brat"
author: "Clare Verbeek, Thembani Dladla, Zanele Buthelezi; translated by Aleksandra Migorska"
licence: cc-by-nc
source: https://global-asp.github.io/storybooks-poland/stories/pl/0129/
tags:
  level: A1
text: |
  Budzę się i rozpalam ognisko.

  Gotuję wodę.

  Rąbię drewno.

  Mieszam w kociołku.

  Zamiatam podłogę.

  Zmywam naczynia.

  Dlaczego ja tak ciężko pracuję… gdy mój brat jest zajęty zabawą?
