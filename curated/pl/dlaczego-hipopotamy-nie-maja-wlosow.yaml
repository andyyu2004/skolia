kind: inline
title: "Dlaczego hipopotamy nie mają włosów"
author: "Basilio Gimo, David Ker; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0111/
tags:
  level: A2
text: |
  [Pewnego dnia, Zając skakał sobie brzegiem rzeki.]{02}

  [Hipcio też tam był, przechadzał się i podjadał zieloną trawę.]{03}

  [Hipcio nie zauważył Zająca i przez przypadek stanął Zającowi na łapce. Zając zaczął krzyczeć: „Hipciu, czy nie widzisz, że stoisz mi na łapce?”]{04}

  [„Bardzo cię przepraszam” – rzekł Hipcio, „Nie widziałem cię, proszę przebacz mi!”. Ale Zając nie chciał tego słuchać i krzyczał na Hipcia: „Zrobiłeś to specjalnie! Kiedyś za to zapłacisz, zobaczysz!”]{05}

  [Zając poszedł poprosić Ogień o pomoc: „Hipcio na mnie stanął!” „Spal Hipcia, gdy wyjdzie z wody, aby zjeść trawę”. „Nie ma problemu przyjacielu, zrobię jak chcesz” – odparł Ogień.]{06}

  [Później gdy Hipcio jadł trawę daleko od rzeki, płomienie ognia zaczęły palić jego włosy!]{07}

  [Hipcio rozpłakał się i szybko pobiegł do wody. Ogień spalił wszystkie włosy. Hipcio płakał: „O nie! Moje piękne włosy! Wszystkie zniszczone!”]{08}

  [Zając cieszył się nieszczęściem Hipcia. I do dzisiejszego dnia, hipopotamy w obawie przed ogniem, nigdy nie oddalają się od wody.]{09}
