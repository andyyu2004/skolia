kind: inline
title: "Dzień, w którym opuściłem dom i wyjechałem do miasta"
author: "Lesley Koyi, Ursula Nafula; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0324/
tags:
  level: A2
text: |
  [Przystanek autobusowy w mojej wiosce był mały, zatłoczony i pełny przeładowanych autobusów. Na ziemi leżało mnóstwo rzeczy do załadunku. Sprzedawcy biletów wykrzykiwali nazwy miejscowości, do których jechały autobusy.]{02}

  [„Centrum! Centrum! Zachód!” – usłyszałem. To był mój autobus.]{03}

  [Mój autobus był prawie pełny, ale ludzie nadal przepychali się, aby dostać się do środka. Niektórzy upychali swój bagaż pod autobusem, inni umieszczali bagaże na półkach w środku.]{04}

  [Nowi pasażerowie ściskali w rękach swoje bilety i szukali wolnych miejsc. Kobiety z małymi dziećmi próbowały zadbać o to aby dzieciom było wygodnie w czasie długiej podróży.]{05}

  [Wcisnąłem się na miejsce pod oknem. Obok mnie siedział mężczyzna. W ręce kurczowo trzymał zieloną reklamówkę. Miał na sobie stare sandały i znoszoną marynarkę. Wyglądał na zdenerwowanego.]{06}

  [Spojrzałem przez okno i uświadomiłem sobie, że opuszczam moją wioskę, miejsce w którym dorastałem. Wyruszałem do dużego miasta.]{07}

  [Zakończono załadunek, wszyscy pasażerowie byli na swoich miejscach. Mimo to sprzedawcy nadal krzyczeli, próbując zachęcić ludzi do kupna ich produktów. Ich słowa brzmiały zabawnie.]{08}

  [Niektórzy pasażerowie kupili napoje, inni kupili przekąski i zaczęli pić i jeść. Ci, którzy tak jak ja nie mieli pieniędzy, tylko patrzyli.]{09}

  [Autobus zatrąbił. Był to znak, że byliśmy gotowi do odjazdu. Sprzedawca biletów krzyczał na sprzedających, żeby wysiedli z autobusu.]{10}

  [Sprzedawcy przepychali się w stronę wyjścia. Niektórzy wydawali resztę podróżnym, podczas gdy inni wciąż próbowali coś sprzedać.]{11}

  [Gdy autobus odjeżdżał z przystanku, patrzyłem przez okno i zastanawiałem się czy jeszcze kiedyś tu wrócę.]{12}

  [Podczas podróży, w autobusie zrobiło się bardzo gorąco. Zamknąłem oczy. Miałem nadzieję, że zasnę.]{13}

  [Moje myśli popłynęły z powrotem do domu. Czy moja matka będzie bezpieczna? Czy sprzedaż królików przyniesie nam pieniądze? Czy brat będzie pamiętał, aby podlewać sadzonki?]{14}

  [Po drodze próbowałem zapamiętać nazwę miejsca, w którym mieszka mój wujek w dużym mieście. Wciąż ją cicho powtarzałem, gdy zasnąłem.]{15}

  [Dziewięć godzin później obudziło mnie głośne uderzenie w autobus i nawoływanie pasażerów wracających do wioski. Wziąłem moją małą torbę i wyskoczyłem z autobusu.]{16}

  [Autobus powrotny szybko się wypełniał. Niedługo będzie wracał na wschód. Najważniejsze było dla mnie teraz, aby odnaleźć dom mojego wujka.]{17}
