kind: inline
title: "Bardzo wysoki człowiek"
author: "Cornelius Gulere; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0001/
tags:
  level: A2
text: |
  [Jego motyka była za krótka.]{02}

  [Jego wejście do domu było za niskie.]{03}

  [Jego łóżko było za krótkie.]{04}

  [Jego rower był za niski.]{05}

  [Ten człowiek był po prostu za wysoki!]{06}

  [Zrobił więc bardzo długą motykę.]{07}

  [Zbudował bardzo wysokie wejście do domu.]{08}

  [Zbudował bardzo długie łóżko.]{09}

  [Kupił bardzo wysoki rower.]{10}

  [Siedział na bardzo wysokim krześle. Jadł bardzo długim widelcem.]{11}

  [Pewnego dnia opuścił swój dom i zamieszkał w ogromnym lesie. Żył bardzo długo.]{12}
