text: |
  Obieram ziemniaki.

  Kroję kapustę.

  Trę marchew.

  Myję fasolę.

  Kroję dynię.

  Siekam szpinak.

  Mama kroi cebulę.

  Gdy kroję cebulę, zawsze płaczę.
