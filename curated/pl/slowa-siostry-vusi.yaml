kind: inline
title: "Słowa siostry Vusi"
author: "Nina Orange; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0291/
tags:
  level: B1
text: |
  [Pewnego wczesnego poranka babcia Vusi zwróciła się do chłopca: „Vusi, proszę weź to jajko i zanieś je swoim rodzicom. Rodzice chcą upiec wielki tort na ślub Twojej siostry”.]{02}

  [W drodze do rodziców Vusi spotkał dwóch chłopców, którzy zbierali owoce. Jeden z nich zabrał Vusi jajko i rzucił nim w drzewo. Jajko rozbiło się.]{03}

  [„Coś ty zrobił?” – krzyknął Vusi. „To jajko miało być na tort na ślub mojej siostry. Co powie moja siostra gdy nie będzie tortu?”]{04}

  [Chłopcy poczuli się głupio. „Niestety nie możemy pomóc Ci z tortem, ale proszę weź ten kij dla swojej siostry”- powiedział jeden z nich. Vusi wyruszył w dalszą podróż.]{05}

  [Po drodze spotkał dwóch mężczyzn, którzy budowali dom. „Czy możemy użyć tego kija?” – zapytał jeden z nich. Kij nie był jednak wystarczająco mocny i złamał się.]{06}

  [„Co zrobiliście?” – krzyknął Vusi. „Ten kij był prezentem dla mojej siostry. Zbieracze owoców dali mi ten kij, bo rozbili jajko na tort. Tort miał być na ślub mojej siostry. A teraz nie mam ani jajka, ani tortu, ani prezentu. Co powie moja siostra?”]{07}

  [Robotnicy poczuli się głupio: „Nie możemy pomóc Ci z tortem, ale proszę weź tę słomę na dach dla swojej siostry.” Vusi powędrował dalej.]{08}

  [Po drodze Vusi spotkał rolnika z krową. „Ta słoma wygląda tak smakowicie, czy mogę skubnąć?” – zapytała krowa. Krowa zjadła całą słomę, bo słoma była bardzo smaczna!]{09}

  [„Coś ty zrobiła?” – krzyknął Vusi. „To był prezent dla mojej siostry. Robotnicy dali mi słomę, bo złamali kij od zbieraczy owoców. Zbieracze owoców dali mi kij, bo rozbili jajko na tort na ślub mojej siostry. A teraz nie mam ani jajka, ani tortu, ani prezentu. Co powie moja siostra?”]{10}

  [Krowa poczuła się głupio. Rolnik pozwolił Vusiemu zabrać krowę jako prezent dla siostry. Vusi poszedł dalej.]{11}

  [Krowa uciekła i wróciła do rolnika. Vusi zgubił się i spóźnił się na ślub siostry. Wszyscy goście już jedli.]{12}

  [„Co mam teraz zrobić?” – krzyczał Vusi. „Krowa, która uciekła, była prezentem w zamian za słomę od robotników. Robotnicy dali mi słomę, bo złamali kij od zbieraczy owoców. Zbieracze owoców dali mi kij, bo zbili jajko na tort. Tort miał być na ślub. A teraz nie mam ani jajka, ani tortu, ani prezentu.”]{13}

  [Siostra Vusi pomyślała przez chwilę i powiedziała: „Vusi, mój bracie, nie zależy mi na prezentach. Nie zależy mi nawet na torcie! Jesteśmy tutaj wszyscy razem i dlatego jestem szczęśliwa! Załóż odświętne ubranie i świętujmy ten dzień!” I tak też zrobił Vusi.]{14}
