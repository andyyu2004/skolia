title: "Włosy"
author: "Clare Verbeek, Thembani Dladla, Zanele Buthelezi; translated by Aleksandra Migorska"
licence: cc-by-nc
source: https://global-asp.github.io/storybooks-poland/stories/pl/0120/
tags:
  level: A1
text: |
  Thuli ma krótkie włosy.

  Anna ma długie włosy.

  Cathy ma najdłuższe włosy.

  Zama ma włosy splecione w warkocze.

  Baba ma brodę.

  Zanele uczesała swoje włosy.

  Thabo podciął swoje włosy.

  Themba zgolił swoje włosy.
