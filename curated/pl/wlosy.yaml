text: |
  [Thuli ma krótkie włosy.]{02}

  [Anna ma długie włosy.]{03}

  [Cathy ma najdłuższe włosy.]{04}

  [Zama ma włosy splecione w warkocze.]{05}

  [Baba ma brodę.]{06}

  [Zanele uczesała swoje włosy.]{07}

  [Thabo podciął swoje włosy.]{08}

  [Themba zgolił swoje włosy.]{09}
