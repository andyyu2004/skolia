kind: inline
title: "Moje ciało"
author: "Clare Verbeek, Thembani Dladla, Zanele Buthelezi; translated by Aleksandra Migorska"
licence: cc-by-nc
source: https://global-asp.github.io/storybooks-poland/stories/pl/0112/
tags:
  level: A1
text: |
  Dzięki niemu mogę biegać.

  Dzięki niemu mogę skakać.

  Dzięki niemu mogę tańczyć.

  Dzięki niemu mogę pływać.

  Dzięki niemu mogę przeskakiwać.

  Dzięki niemu mogę kopać.

  Dzięki niemu mogę uciekać.

  Ale nigdy nie będę mógł latać.
