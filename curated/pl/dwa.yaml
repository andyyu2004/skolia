kind: inline
title: "Dwa"
author: "Carole Bloch; translated by Aleksandra Migorska"
licence: cc-by-nc
source: https://global-asp.github.io/storybooks-poland/stories/pl/0271/
tags:
  level: A1
text: |
  Dwie małe ręce, aby trzymać.

  Dwie małe stopy, aby kopać.

  Dwoje oczu, aby widzieć.

  Dwoje uszu, aby słyszeć.

  Dwa kochające ramiona, aby tulić.
