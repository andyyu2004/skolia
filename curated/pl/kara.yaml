kind: inline
title: "Kara"
author: "Adelheid Marie Bwire; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0342/
tags:
  level: A2
text: |
  [Pewnego dnia, mama przyniosła mnóstwo owoców.]{02}

  [„Kiedy możemy zjeść te owoce?” – pytamy. „Będziemy jeść owoce wieczorem” – odpowiada mama.]{03}

  [Mój brat Rahim jest łakomy, więc próbuje każdego owocu. Je dużo owoców.]{04}

  [„Spójrz co zrobił Rahim!” – krzyczy mój młodszy braciszek. „Rahim jest niegrzeczny i samolubny” – przyznaję.]{05}

  [Mama jest zła na Rahima.]{06}

  [My też jesteśmy źli na Rahima, ale Rahim nie okazuje skruchy.]{07}

  [„Czy nie ukarzesz Rahima?” – pyta mój młodszy braciszek.]{08}

  [„Rahim, już niedługo spotka Cię kara” – ostrzega go mama.]{09}

  [Rahim zaczyna źle się czuć.]{10}

  [„Bardzo boli mnie brzuch” – szepcze Rahim.]{11}

  [Mama przewidziała to wcześniej. Teraz owoce wymierzają karę Rahimowi!]{12}

  [Rahim postanawia nas przeprosić. „Już nigdy nie będę taki samolubny” – obiecuje. Wszyscy mu wierzymy.]{13}
