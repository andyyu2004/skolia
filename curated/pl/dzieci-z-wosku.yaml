kind: inline
title: "Dzieci z wosku"
author: "Southern African Folktale; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0337/
tags:
  level: A2
text: |
  [Dawno, dawno temu, żyła sobie szczęśliwa rodzina.]{02}

  [Nigdy się nie kłócili. Pomagali swoim rodzicom w domu i w polu.]{03}

  [Nie wolno im było jednak zbliżać się do ognia.]{04}

  [Byli zrobieni z wosku, więc musieli wykonywać wszystkie prace w nocy.]{05}

  [Mimo to, jeden z chłopców bardzo pragnął wyjść na zewnątrz w ciągu dnia.]{06}

  [Pewnego dnia, pragnienie było zbyt silne. Jego bracia ostrzegali go…]{07}

  [Niestety było już za późno! Chłopiec stopił się w gorącym słońcu.]{08}

  [Dzieci z wosku były bardzo poruszone tym, co stało się z ich bratem.]{09}

  [Postanowili, że ze stopionego wosku ulepią ptaka.]{10}

  [Zabrali brata-ptaka, wysoko, na sam szczyt góry.]{11}

  [Gdy wzeszło słońce, ptak odleciał ćwierkając w porannym świetle.]{12}
