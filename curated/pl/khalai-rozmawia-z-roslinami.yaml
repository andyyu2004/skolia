kind: inline
title: "Khalai rozmawia z roślinami"
author: "Ursula Nafula; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0089/
tags:
  level: A2
text: |
  [Oto Khalai. Ma siedem lat. W jej języku, Lubukusu, jej imię oznacza: „ta dobra”.]{02}

  [Khalai budzi się i mówi do drzewa pomarańczowego: „Proszę rośnij duże i daj nam mnóstwo dojrzałych pomarańczy”.]{03}

  [Gdy Khalai jest w drodze do szkoły, mówi do trawy: „Proszę rośnij zieloniutka i nie wysychaj”.]{04}

  [Gdy mija polne kwiaty, mówi: „Proszę kwitnijcie, abym mogła upiąć was w moich włosach”.]{05}

  [W szkole, Khalai mówi do drzewa na środku podwórka: „Proszę wypuść ogromne gałęzie, abyśmy mogli czytać w twoim cieniu”.]{06}

  [Khalai mówi do żywopłotu, który otacza jej szkołę: „Proszę rośnij silny i zatrzymuj złych ludzi, aby tutaj nie wchodzili”.]{07}

  [Gdy Khalai wraca ze szkoły, odwiedza drzewo pomarańczowe: „Czy twoje owoce są już dojrzałe?”]{08}

  [„Pomarańcze są nadal zielone” – wzdycha dziewczynka. „Do zobaczenia jutro” – mówi Khalai. „Może jutro podarujesz mi dojrzałe i soczyste owoce”.]{09}
