kind: inline
title: "Tingi i krowy"
author: "Ingrid Schechter; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0210/
tags:
  level: A2
text: |
  [Tingi mieszkał z babcią.]{02}

  [Razem z babcią, chłopiec opiekował się krowami.]{03}

  [Pewnego dnia zjawili się żołnierze.]{04}

  [Zabrali wszystkie krowy.]{05}

  [Tingi razem z babcią uciekli, aby się ukryć.]{06}

  [Ukrywali się w buszu aż do zmroku.]{07}

  [Wtedy wrócili żołnierze.]{08}

  [Babcia ukryła wnuczka pod liśćmi.]{09}

  [Jeden z żołnierzy postawił na chłopcu stopę, ale Tingi nie wydał z siebie żadnego dźwięku.]{10}

  [Kiedy było wystarczająco bezpiecznie, Tingi wraz z babcią opuścili kryjówkę.]{11}

  [Ostrożnie i po cichu wrócili do domu.]{12}
