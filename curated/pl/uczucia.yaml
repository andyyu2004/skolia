  level: A1
text: |
  [Moje serce odczuwa bardzo wiele.]{02}

  [Czuję się szczęśliwa, gdy wieczorami babcia opowiada nam bajki.]{03}

  [Czuję się figlarnie, gdy bawię się z moją przyjaciółką.]{04}

  [Czuję się źle, gdy tata mówi, że nie ma pieniędzy.]{05}

  [Czuję się kochana, gdy moja mama mnie tuli.]{06}
