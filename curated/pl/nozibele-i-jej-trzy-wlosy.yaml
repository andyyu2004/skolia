kind: inline
title: "Nozibele i jej trzy włosy"
author: "Tessa Welch; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0066/
tags:
  level: A2
text: |
  [Dawno temu trzy dziewczynki poszły nazbierać drewna.]{02}

  [Dzień był gorący, więc poszły też wykąpać się w rzece. Bawiły się, pluskały i pływały w chłodnej wodzie.]{03}

  [Nagle zorientowały się, że zrobiło się bardzo późno i pospieszyły z powrotem do wioski.]{04}

  [Kiedy były już prawie w domu, Nozibele dotknęła ręką swojej szyi. Okazało się, że zapomniała naszyjnika! „Proszę, wróćcie ze mną!” – błagała swoje koleżanki. Niestety, obie dziewczynki uznały, że było już zbyt późno.]{05}

  [Nozibele wróciła więc nad rzekę sama. Znalazła naszyjnik i pospieszyła do domu. Niestety zgubiła się w ciemnościach.]{06}

  [W oddali zauważyła światło dobiegające z chaty. Przyspieszyła kroku i zapukała do drzwi.]{07}

  [Ku jej zdziwieniu, drzwi otworzył pies: „Czego chcesz?” – zapytał. „Zgubiłam się i muszę gdzieś przenocować” – odpowiedziała Nozibele. „Wejdź, bo jak nie, to będę gryzł!” Nozibele posłusznie weszła do środka.]{08}

  [„Ugotuj dla mnie!” – rozkazał pies. „Ale ja nigdy nie gotowałam dla psa” – odpowiedziała dziewczynka. „Gotuj, bo jak nie, to będę gryzł!” Więc Nozibele ugotowała jedzenie dla psa.]{09}

  [„Pościel moje łóżko!” – rozkazał pies. „Nigdy nie słałam łóżka dla psa” – odpowiedziała Nozibele. „Pościel łóżko, bo jak nie, to będę gryzł!” Więc Nozibele posłała łóżko psa.]{10}

  [Codziennie musiała gotować, zamiatać i zmywać dla psa. Pewnego dnia pies zwrócił się do Nozibele: „Muszę dziś odwiedzić moich przyjaciół. Pozamiataj, ugotuj i pozmywaj zanim wrócę.”]{11}

  [Gdy pies wyszedł, Nozibele wyrwała trzy włosy. Jeden włos umieściła pod łóżkiem, drugi za drzwiami a trzeci w płocie, który otaczał chatę.]{12}

  [Pies wrócił do domu i zaczął szukać dziewczynki: „Nozibele, gdzie jesteś?” – wołał. „Jestem tutaj, pod łóżkiem” – odpowiedział pierwszy włos. „Jestem tutaj, za drzwiami” – powiedział drugi włos. „Jestem tutaj w płocie” – odpowiedział trzeci włos.]{13}

  [Wtedy pies zrozumiał, że Nozibele go oszukała. Wybiegł z chaty, biegł i biegł aż dotarł do wioski Nozibele. Tam jednak czekali na niego jej bracia. Mieli wielkie kije. Pies odwrócił się na pięcie i uciekł. Nikt od tamtej pory go nie widział.]{14}
