kind: inline
title: "Zemsta Ptaka Miodowoda"
author: "Zulu folktale; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0072/
tags:
  level: B1
text: |
  [Oto historia o ptaku Miodowodzie Ngede oraz o chciwym młodym człowieku Gingile. Pewnego dnia Gingile polował, gdy nagle usłyszał śpiew Ngede. Na samą myśl o miodzie Gingile pociekła ślinka. Zatrzymał się i uważnie nasłuchiwał, aż odnalazł ptaka w gałęziach drzewa – tuż nad swoją głową. „Ćwir, ćwir, ćwir” – śpiewał Miodowód i przeskakiwał z jednego drzewa na drugie. Ptak zatrzymywał się od czasu do czasu, aby upewnić się, że Gingile za nim podąża.]{02}

  [Po pół godzinie dotarli do ogromnego dzikiego drzewa figowego. Ngede skakał jak oszalały między gęstymi konarami. Następnie usiadł na jednej z gałęzi, przechylił głowę w stronę Gingile, tak jakby chciał powiedzieć: „To już tutaj! Na co czekasz?!” Gingile stał pod drzewem, więc nie widział żadnych pszczół, ale ufał Ngede.]{03}

  [Gingile odłożył swoją włócznię, zebrał kilka suchych gałęzi i rozpalił małe ognisko. Kiedy ognisko było dobrze rozpalone, Gingile włożył długi suchy kijek w sam środek ognia. Było to wyjątkowe drewno, które wydziela mocny dym. Gingile włożył dymiący kijek w zęby i zaczął wspinać się na drzewo.]{04}

  [Wkrótce usłyszał głośne bzyczenie pracowitych pszczół, które wlatywały i wylatywały z dziupli z ulem. Kiedy Gingile wepchnął dymiący kijek do dziupli, rozzłoszczone pszczoły wyleciały z ula! Odleciały, bo nie lubią dymu ale wcześniej kilka z nich boleśnie użądliło Gingile.]{05}

  [Kiedy pszczoły opuściły ul, Gingile włożył rękę do środka i wyjął ciężki plaster ociekający gęstym miodem, pełen tłustych i białych larw. Ostrożnie włożył plaster do torby, którą miał ze sobą i zaczął schodzić z drzewa.]{06}

  [Miodowód z zaciekawieniem obserwował Gingile i oczekiwał, że w ramach podziękowania Gingile podzieli się z nim swoją zdobyczą. Ptak przelatywał z gałęzi na gałąź, bliżej i bliżej ziemi. Kiedy Gingile zszedł z drzewa, ptak usadowił się na pobliskim kamieniu i czekał na nagrodę.]{07}

  [Gingile zagasił ognisko, zabrał swoją włócznię i poszedł w stronę domu ignorując Ngede. Miodowód ćwierkał rozwścieczony: „ZWY-cięzca! ZWY-cięzca!”. Gingile zatrzymał się, spojrzał na ptaka i roześmiał się głośno: „Chcesz miodu, mój przyjacielu? Ale to ja wykonałem całą ciężką robotę, to mnie użądliły pszczoły. Niby dlaczego miałbym się z tobą dzielić moim miodem?” I Gingile odszedł. Miodowód był wściekły! Nikogo nie wolno tak traktować! Gingile dostanie nauczkę.]{08}

  [Parę tygodni później, Gingile znów usłyszał śpiew Ngede. Przypomniał mu się pyszny miód, więc bez zastanowienia znów wyruszył za śpiewem ptaka. Ngede prowadził Gingile wzdłuż lasu i zatrzymał się na drzewie akacji, aby odpocząć. „Ul musi być właśnie tutaj” – pomyślał Gingile. Szybko rozpalił ognisko, włożył dymiący kijek w zęby i zaczął wspinać się na drzewo. Ptak tylko siedział i przyglądał się.]{09}

  [Gingile wspinał się na drzewo i zastanawiał się dlaczego nie słyszy pszczół. „Może ul jest głęboko w drzewie” – pomyślał. Podciągnął się na gałęzi i znalazł się twarzą w twarz z lampartem! Zwierzę było wściekłe, bo Gingile zbudził go ze snu. Lampart zmrużył oczy i otworzył paszczę pełną dużych i ostrych kłów.]{10}

  [Lampart nie zdążył zaatakować, bo Gingile zaczął szybko schodzić z drzewa. W pośpiechu nie złapał jednej z gałęzi, spadł z hukiem na ziemię i zwichnął sobie kostkę. Kulejąc, uciekał jak najszybciej potrafił. Na szczęście lampart był zbyt zaspany, aby go dogonić. W ten oto sposób Ngede zemścił sie na Gingile, który dostał nauczkę.]{11}

  [Dzieci Gingile słuchają historii o Ngede i uczą się szacunku dla małego ptaka. Dlatego zawsze gdy zbierają miód, zostawiają największy kawałek plastra miodu dla ptaka Miodowoda.]{12}
