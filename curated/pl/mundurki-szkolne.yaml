text: |
  [Ta sukienka jest długa.]{02}

  [Ta bluza jest duża.]{03}

  [Ta torba jest duża.]{04}

  [Ten pasek jest…?]{05}

  [Ten kapelusz jest mały.]{06}

  [Te skarpetki są krótkie.]{07}

  [Ale te buty są nowe.]{08}

  [… pasują idealnie.]{09}
