title: "Mundurki szkolne"
author: "Clare Verbeek, Thembani Dladla, Zanele Buthelezi; translated by Aleksandra Migorska"
licence: cc-by-nc
source: https://global-asp.github.io/storybooks-poland/stories/pl/0003/
tags:
  level: A1
text: |
  Ta sukienka jest długa.

  Ta bluza jest duża.

  Ta torba jest duża.

  Ten pasek jest…?

  Ten kapelusz jest mały.

  Te skarpetki są krótkie.

  Ale te buty są nowe.

  … pasują idealnie.
