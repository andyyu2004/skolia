title: "Lubię czytać!"
author: "Letta Machoga; translated by Aleksandra Migorska"
licence: cc-by
source: https://global-asp.github.io/storybooks-poland/stories/pl/0087/
tags:
  level: A1
text: |
  Lubię czytać!

  Komu mogę poczytać?

  Moja siostra już śpi.

  Komu mogę poczytać?

  Mama i babcia są zajęte.

  Komu mogę poczytać?

  Tata i dziadek są zajęci.

  Komu mogę poczytać? Mogę poczytać sobie sam!
