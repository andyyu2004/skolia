kind: inline
title: "Liczymy zwierzęta"
author: "Zanele Buthelezi, Thembani Dladla, Clare Verbeek; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0327/
tags:
  level: A1
text: |
  [Jeden słoń będzie pić wodę.]{02}

  [Dwie żyrafy będą pić wodę.]{03}

  [Trzy bawoły i cztery ptaki również będą pić wodę.]{04}

  [Pięć antylop i sześć guźców podchodzi do wodopoju.]{05}

  [Siedem zebr biegnie do wodopoju.]{06}

  [Osiem żab i dziewięć ryb pływa w wodzie.]{07}

  [Jeden lew ryczy. On również chce napić się wody. Kto się boi lwa?]{08}

  [Jeden słoń i lew piją razem wodę.]{09}
