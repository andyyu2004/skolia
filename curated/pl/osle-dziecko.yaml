kind: inline
title: "Ośle Dziecko"
author: "Lindiwe Matshikiza; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0201/
tags:
  level: A2
text: |
  [Mała dziewczynka zobaczyła tajemniczy kształt w oddali.]{02}

  [Gdy kształt przybliżył się, dziewczynka zobaczyła, że była to kobieta w zaawansowanej ciąży.]{03}

  [Nieśmiała ale dzielna dziewczynka podeszła bliżej do kobiety. „Zostań z nami. Zaopiekujemy się Tobą i dzieckiem” – powiedzieli ludzie, z którymi była dziewczynka.]{04}

  [Nadszedł dzień narodzin dziecka: „Pchaj! Przynieście koce i wodę! Pchaaaaaaj!”]{05}

  [Ku zdziwieniu wszystkich, zamiast dziecka, kobieta urodziła osiołka!]{06}

  [Ludzie zaczęli się kłócić: „Obiecaliśmy tej kobiecie i jej dziecku bezpieczeństwo, i tak zrobimy” – mówili jedni. „Przyniosą nam pecha!” – krzyczeli inni.]{07}

  [Kobieta poczuła się samotna. Nie wiedziała co ze sobą zrobić i co zrobić z tym dziwnym oślim dzieckiem.]{08}

  [W końcu musiała zaakceptować, że osiołek był jej dzieckiem, a ona jego matką.]{09}

  [Wszystko wyglądałoby inaczej gdyby ośle dziecko nie rosło. Ale osiołek rósł i rósł aż był tak duży, że nie mieścił się na plecach matki. Chociaż bardzo się starał, nie potrafił zachowywać się jak ludzie. Jego matka była często zmęczona i poirytowana. Czasami zmuszała go do pracy przeznaczonej dla zwierząt.]{10}

  [Zagubienie i złość rosły w osiołku. Nie wolno mu było robić tego i tamtego. Miał się zachowywać tak, a nie inaczej. Pewnego dnia był tak wściekły, że kopnął swoją matkę!]{11}

  [Osiołek poczuł się bardzo winny. Zaczął uciekać, najszybciej jak potrafił i najdalej jak mógł.]{12}

  [Kiedy wreszcie się zatrzymał, było już ciemno. „I-o? I-o?” – wyszeptał. „I-o? I-o?” – odpowiedziało echo. Był sam. Zwinął się w kulkę i zapadł w głęboki, niespokojny sen.]{13}

  [Osiołek obudził się i zauważył dziwnego staruszka, który mu się przyglądał. Spojrzał w oczy staruszka i poczuł iskierkę nadziei.]{14}

  [Osiołek zamieszkał ze staruszkiem, który nauczył go wielu sposobów na przetrwanie. Osiołek słuchał i uczył się od staruszka, a staruszek od osiołka. Pomagali sobie nawzajem i często się śmiali.]{15}

  [Pewnego ranka, staruszek poprosił osiołka, aby zaniósł go na szczyt góry.]{16}

  [Wysoko pośród chmur obaj zasnęli. Osiołek śnił o matce, która była ciężko chora i wzywała go. Gdy się obudził…]{17}

  […chmury zniknęły, a razem z nimi zniknął jego przyjaciel staruszek.]{18}

  [Osiołek wiedział już co ma zrobić.]{19}

  [Osiołek odnalazł swoją matkę. Była samotna i opłakiwała swoje zagubione dziecko. Patrzyli na siebie przez dłuższą chwilę, a potem przytulili się bardzo mocno do siebie.]{20}

  [Ośle dziecko i jego matka nauczyli się żyć razem. Powoli, wokół nich, zaczęły osiedlać się inne rodziny.]{21}
