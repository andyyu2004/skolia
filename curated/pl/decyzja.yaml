kind: inline
title: "Decyzja"
author: "Ursula Nafula; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0027/
tags:
  level: A2
text: |
  [Moja wioska miała wiele problemów. Staliśmy w długiej kolejce, żeby nabrać wody ze źródła.]{02}

  [Czekaliśmy na jedzenie, które przekazywali nam inni ludzie.]{03}

  [Musieliśmy zamykać drzwi na klucz ze względu na złodziei.]{04}

  [Wiele dzieci rzuciło szkołę.]{05}

  [Dziewczynki pracowały jako sprzątaczki w innych wioskach.]{06}

  [Chłopcy włóczyli się po wiosce, podczas gdy inni musieli pracować w polu.]{07}

  [Gdy wiał wiatr, papierowe śmieci zatrzymywały się na drzewach i płotach.]{08}

  [Ludzie kaleczyli się kawałkami potłuczonego szkła, które leżało na ziemi.]{09}

  [Pewnego dnia źródło wody wyschło i nasze pojemniki na wodę były puste.]{10}

  [Mój ojciec chodził od domu do domu, żeby zaprosić mieszkańców wioski na spotkanie.]{11}

  [Ludzie zebrali się pod wielkim drzewem i słuchali.]{12}

  [Mój ojciec wstał i powiedział: „Jeżeli chcemy rozwiązać nasze problemy, musimy współpracować”.]{13}

  [Ośmioletnia Juma, która siedziała na pniu drzewa, krzyknęła: „Ja pomogę w sprzątaniu!”]{14}

  [Jedna z kobiet powiedziała: „Kobiety mogą do mnie dołączyć i razem będziemy uprawiać żywność”.]{15}

  [Jeden z mężczyzn wstał i oświadczył: „Mężczyźni wykopią i wybudują studnię”.]{16}

  [Krzyknęliśmy jednym głosem: „Musimy zmienić nasze życie!” Od tej pory zawsze współpracujemy, aby rozwiązać nasze wspólne problemy.]{17}
