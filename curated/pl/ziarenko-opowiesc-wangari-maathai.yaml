kind: inline
title: "Ziarenko: Opowieść Wangari Maathai"
author: "Nicola Rijsdijk; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0110/
tags:
  level: A2
text: |
  [W wiosce, na zboczu najwyższej góry Kenii we wschodniej Afryce, żyła sobie mała dziewczynka. Razem z mamą pracowały w polu. Dziewczynka miała na imię Wangari.]{02}

  [Wangari uwielbiała być na zewnątrz. Przygotowywała maczetą glebę, aby zasiać maleńkie ziarenka w ciepłej ziemi w ogrodzie należącym do jej rodziny.]{03}

  [Jej ulubioną porą dnia był czas zaraz po zachodzie słońca. Wangari wiedziała, że gdy robiło się zbyt ciemno aby zobaczyć rośliny, powinna wrócić do domu. Dziewczynka szła wąskimi ścieżkami między polami, przekraczając po drodze rzeki.]{04}

  [Wangari była mądrą dziewczynką i nie mogła doczekać się, aby pójść do szkoły. Mimo to, jej rodzice chcieli, aby Wangari została w domu i pomagała im w obowiązkach. Gdy miała siedem lat, jej starszy brat przekonał jednak rodziców, aby pozwolili jej pójść do szkoły.]{05}

  [Wangari bardzo lubiła się uczyć! Z każdej nowej książki dowiadywała się czegoś nowego. W szkole szło jej tak dobrze, że otrzymała zaproszenie, aby kontynuować naukę w Stanach Zjednoczonych! Dziewczynka była bardzo szczęśliwa! Była bardzo ciekawa świata.]{06}

  [Wangari nauczyła się wielu nowych rzeczy na Amerykańskim uniwersytecie. Uczyła się o roślinach i przypominała sobie swoje dzieciństwo. Pamiętała jak bawiła się z braćmi w cieniu drzew w pięknych lasach Kenii.]{07}

  [Im więcej wiedzy zdobywała, tym bardziej uświadamiała sobie jak bardzo kocha Kenię. Chciała, aby jej mieszkańcy byli radośni i wolni. Im więcej wiedzy zdobywała, tym bardziej przypominał jej się jej dom w Afryce.]{08}

  [Kiedy zakończyła edukację, wróciła do Kenii. Jednak jej kraj bardzo się zmienił. Wszędzie były ogromne gospodarstwa rolne. Kobietom brakowało drewna, które było potrzebne do przyrządzania posiłków. Ludzie byli biedni, a dzieci głodne.]{09}

  [Na szczęście Wangari wiedziała co robić. Nauczyła kobiety jak siać nasiona drzew. Kobiety sprzedawały drzewa i z zarobionych pieniędzy utrzymywały swoje rodziny. Kobiety były bardzo szczęśliwe. Dzięki pomocy Wangari czuły, że są silne i potrzebne.]{10}

  [Czas mijał, nowe drzewa rozrosły się tworząc lasy, a rzeki znów zaczęły płynąć. Nauki Wangari rozniosły się po całej Afryce. Dzięki Wangari i jej ziarenkom, miliony drzew rosną dziś na całym kontynencie.]{11}

  [Ludzie z całego świata zwrócili uwagę na ciężką pracę Wangari i jej osiągnięcia. Nagrodzono ją nagrodą Nobla. Wangari była pierwszą kobietą z Afryki, która otrzymała to niecodzienne wyróżnienie.]{12}

  [Wangari zmarła w 2011 roku, ale pamiętamy o niej zawsze gdy widzimy piękne drzewo.]{13}
