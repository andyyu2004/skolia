kind: inline
title: "Co robisz?"
author: "Nina Orange; translated by Aleksandra Migorska"
licence: cc-by
source: https://global-asp.github.io/storybooks-poland/stories/pl/0008/
tags:
  level: A1
text: |
  Ja śpiewam.

  Ona macha.

  Ja klaszczę.

  Ona się rozciąga.

  On kogoś woła.

  Ja odpowiadam.

  Ona słucha.

  A Ty, co robisz?
