kind: inline
title: "Tom – sprzedawca bananów"
author: "Humphreys Odunga; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0296/
tags:
  level: A2
text: |
  [Tom niesie pojemnik z dojrzałymi bananami.]{02}

  [Tom idzie na rynek sprzedawać banany.]{03}

  [Ludzie kupują różne owoce na rynku.]{04}

  [Ale nikt nie kupuje bananów Toma. Ludzie wolą kupować owoce od kobiet.]{05}

  [Ludzie mówią: „U nas tylko kobiety sprzedają owoce. Od kiedy to owoce sprzedaje mężczyzna?”]{06}

  [Tom nie poddaje się i nawołuje: „Kupujcie moje banany! Pyszne, dojrzałe banany tylko u mnie!”]{07}

  [Jedna z kobiet podchodzi bliżej, bierze kiść bananów i zaczyna ją dokładnie oglądać.]{08}

  [Kobieta postanawia kupić banany.]{09}

  [Więcej osób zaczyna podchodzić do stoiska aby kupić banany Toma.]{10}

  [Wkrótce okazuje się, że pojemnik na banany jest pusty. Tom liczy pieniądze, które zarobił.]{11}

  [Później Tom kupuje mydło, cukier i chleb i wkłada je do swojego pojemnika.]{12}

  [Tom próbuje utrzymać równowagę, gdy niesie pojemnik na głowie i wraca do domu.]{13}
