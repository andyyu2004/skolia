kind: inline
title: "Kura i Orlica"
author: "Ann Nduku; translated by Aleksandra Migorska"
licence: cc-by
source: &story https://global-asp.github.io/storybooks-poland/stories/pl/0158/
tags:
  level: A2
text: |
  [Dawno, dawno temu Kura i Orlica przyjaźniły się. Żyły w zgodzie ze wszystkimi ptakami. Żaden z ptaków nie potrafił latać.]{02}

  [Pewnego dnia na ziemi nastał głód. Orlica musiała wędrować bardzo daleko, aby znaleźć pożywienie. Gdy wróciła zmęczona powiedziała: „Musi być jakiś prostszy sposób podróżowania!”]{03}

  [Po dobrze przespanej nocy Kura wpadła na znakomity pomysł. Zaczęła zbierać pióra, które leżały na ziemi. „Pozszywajmy je ze sobą, a potem przyczepmy je do naszych piór” – powiedziała. „Może wtedy będzie nam łatwiej podróżować.”]{04}

  [Orlica była jedynym ptakiem, który miał igłę, więc zaczęła szyć pierwsza. Uszyła parę pięknych skrzydeł i poleciała wysoko nad głową Kury. Kura pożyczyła igły od Orlicy i zaczęła szyć, ale szybko znudziła się tym zajęciem. Zostawiła igłę na szafce i wróciła do kuchni, aby przygotować obiad dla dzieci.]{05}

  [Inne ptaki zobaczyły odlatującą Orlicę i poprosiły Kurę, aby pożyczyła im igły. Wkrótce po niebie latało mnóstwo ptaków.]{06}

  [Kiedy ostatni ptak zwrócił igłę, Kury nie było w domu. Jej dzieci wzięły igłę i zaczęły się nią bawić. Kiedy znudziły się zabawą, zostawiły igłę w piasku.]{07}

  [Orlica wróciła po południu i poprosiła o zwrot igły. Chciała poprawić swoje skrzydła, które poluzowały się podczas lotu. Kura szukała igły na szafce. Szukała w kuchni. Szukała na podwórku. Igła zniknęła!]{08}

  [„Daj mi jeden dzień!” – Kura błagała Orlicę. „Wtedy naprawisz swoje skrzydła i znów polecisz po jedzenie”. Orlica odpowiedziała: „Jeden dzień. Jeżeli nie znajdziesz mojej igły, oddasz mi jedno ze swoich piskląt jako zapłatę.”]{09}

  [Kiedy Orlica przybyła następnego dnia, Kura grzebała w piasku, ale igły nadal nigdzie nie było. Orlica szybko obniżyła lot i porwała jedno z piskląt. Od tej pory, zawsze gdy nadlatuje Orlica, Kura grzebie w piasku szukając igły.]{10}

  [Gdy cień skrzydeł Orlicy pada na ziemię, Kura ostrzega swoje pisklęta, aby się schowały. Pisklęta odpowiadają: „Nie jesteśmy głupie. Uciekniemy i schowamy się!”]{11}
